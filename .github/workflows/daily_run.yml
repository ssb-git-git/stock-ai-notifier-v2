name: Market Analysis Slack Notifier

on:
  # スケジュール実行（UTC時刻指定）
  schedule:
    # ① 日本時間 08:45 (東証開場前) ➔ 前日 23:45 UTC (遅延対策で 23:41 UTC に設定)
    - cron: '41 23 * * *'
    
    # ② 日本時間 12:00 (昼休み) ➔ 当日 03:00 UTC (遅延対策で 02:57 UTC に設定)
    - cron: '57 2 * * *'
    
    # ③ 日本時間 19:00 (夜) ➔ 当日 10:00 UTC (遅延対策で 09:57 UTC に設定)
    - cron: '57 9 * * *'

  # 手動実行ボタン（テスト用）
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストールとブラウザ準備
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium

      - name: 日本語フォントのインストール
        run: sudo apt-get install -y fonts-noto-cjk

      - name: スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_NEWS: ${{ secrets.SLACK_CHANNEL_NEWS }}
        run: python main.py
